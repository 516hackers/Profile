<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wallet Connect V2 Direct Provider</title>
    
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    
    <script type="module">
        // This is a minimal way to make the EthereumProvider class available globally 
        // using the CDN import map method, which is generally more reliable.
        import { EthereumProvider } from 'https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.14.2/+esm';
        window.EthereumProvider = EthereumProvider;
        console.log("EthereumProvider module loaded.");
    </script>
    
    <script type="module" src="index.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mydiv">
        
        <label for="fromAddress" class="Heading">Your Connected Wallet Address:</label>
        <p id="address">Not Connected</p>
        
        <span id="labelIndent">
            <label for="toAddress" class="Heading">To Address:</label>
            <input type="text" class="toAddress address" id="toAddressInput" placeholder="0x..." name="toAddress"><br><br>
        </span>
        
        <button onclick="connectWC()" id="connectButton">Connect Wallet</button>
        <button onclick="send()" id="sendButton" disabled>Send 0.001 XDC</button>
        <button onclick="disconnect()" id="disconnectButton" disabled>Disconnect Wallet</button>
    </div>
</body>
</html>
