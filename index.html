<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wallet Connect V2 Demo</title>
    
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    
    <script type="module" src="https://unpkg.com/@web3modal/standalone@2.6.4/dist/web3modal-standalone.umd.js"></script>

    <script src="index.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mydiv">
        
        <label for="fromAddress" class="Heading">Your Connected Wallet Address:</label>
        <p id="address">Not Connected</p>
        
        <span id="labelIndent">
            <label for="toAddress" class="Heading">To Address:</label>
            <input type="text" class="toAddress address" id="toAddressInput" placeholder="0x..." name="toAddress"><br><br>
        </span>
        
        <button onclick="connectWC()">Connect Wallet</button>
        <button onclick="send()" id="sendButton" disabled>Send 0.001 XDC</button>
        <button onclick="disconnect()" id="disconnectButton" disabled>Disconnect Wallet</button>
    </div>
</body>
</html>
