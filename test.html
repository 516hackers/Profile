<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet Login Demo (Final Working Code)</title>

    <script type="module">
        // Import AppKit & Wagmi dependencies using the stable version 1.8.10
        import { createAppKit } from "https://esm.sh/@reown/appkit@1.8.10"; 
        import { WagmiAdapter } from "https://esm.sh/@reown/appkit-adapter-wagmi@1.8.10"; 
        
        // --- Network Definitions (Hardcoded for stability) ---
        const mainnet = { id: 1, name: 'Ethereum', nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 }, rpcUrls: { default: { http: ['https://mainnet.infura.io/v3/'] } } };
        const arbitrum = { id: 42161, name: 'Arbitrum One', nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 }, rpcUrls: { default: { http: ['https://arb1.arbitrum.io/rpc'] } } };
        const bsc = { id: 56, name: 'BNB Smart Chain', nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 }, rpcUrls: { default: { http: ['https://bsc-dataseed.bnbchain.org'] } } };


        // --- Configuration ---
        // 🟢 PROJECT ID: Using the Auth API provided by the user
        const projectId = "7d99fa64-887e-4901-95d4-32af40e920f3"; 
        
        const networks = [mainnet, arbitrum, bsc];
        
        // 🟢 METADATA EXAMPLE: Fully configured metadata object
        const metadata = {
            name: "My Trust DApp", // Your application's name
            description: "A secure Web3 login portal.", // A short description
            url: window.location.origin, // Must match your hosted domain (e.g., https://516hackers.github.io/Profile)
            icons: ["https://example.com/dapp-logo.png"], // URL to your application's logo
        };

        // --- Initialization ---

        const wagmiAdapter = new WagmiAdapter({
            projectId,
            networks,
            metadata
        });

        const appkit = createAppKit({
            adapters: [wagmiAdapter],
            projectId,
            networks,
            metadata,
            features: {
                analytics: true
            }
        });
        
        // --- Button and Status Display Logic ---

        const updateStatus = (account, chainId) => {
            const statusElement = document.getElementById('status-container');
            if (account) {
                const chainName = networks.find(n => n.id === chainId)?.name || `Chain ID ${chainId}`;
                statusElement.innerHTML = `
                    <p style="color: green;">Status: **Connected**</p>
                    <p>Address: <b>${account.address.substring(0, 6)}...${account.address.slice(-4)}</b></p>
                    <p>Network: ${chainName}</p>
                `;
            } else {
                statusElement.innerHTML = '<p style="color: red;">Status: **Disconnected**</p>';
            }
        };

        // 🟢 FIX: Function to dynamically insert the button after the SDK is ready
        const renderAppkitButton = () => {
            const container = document.getElementById('button-container');
            const loadingMessage = container.querySelector('p');

            if (container) {
                // Remove the loading message
                if (loadingMessage) {
                     container.removeChild(loadingMessage);
                }
                
                // Insert the appkit-button element
                const button = document.createElement('appkit-button');
                container.appendChild(button);
                console.log("Appkit button rendered successfully.");
            }
        };

        // 🟢 Event Listeners 
        wagmiAdapter.on('connect', ({ account, chainId }) => {
            updateStatus(account, chainId);
            console.log("Wallet Connected:", account.address, "Chain:", chainId);
        });

        wagmiAdapter.on('disconnect', () => {
            updateStatus(null, null);
            console.log("Wallet Disconnected.");
        });

        wagmiAdapter.on('chainChanged', ({ account, chainId }) => {
            updateStatus(account, chainId);
            console.log("Chain Changed to:", chainId);
        });

        // 🟢 FINAL FIX: Use a timeout to guarantee the custom element is registered
        document.addEventListener('DOMContentLoaded', () => {
            // Wait 1 second before trying to render the button to ensure Web Component registration is complete.
            setTimeout(() => {
                renderAppkitButton();
                
                // Initial connection check
                const initialAccount = wagmiAdapter.getAccount();
                if (initialAccount) {
                    updateStatus(initialAccount, initialAccount.chainId);
                } else {
                    updateStatus(null, null);
                }
            }, 1000); // 1000ms delay

        });

    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }
        #status-container {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: inline-block;
            text-align: left;
        }
        #status-container p {
            margin: 5px 0;
        }
        #button-container {
            min-height: 40px; /* Ensures layout doesn't jump */
        }
    </style>

</head>
<body>

    <h1>Trust Wallet / Web3 Login Demo</h1>

    <div id="button-container">
        <p>Loading Wallet SDK...</p>
    </div>

    <div id="status-container">
        <p style="color: red;">Status: **Disconnected**</p>
    </div>

</body>
</html>
