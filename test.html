<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet Login (HTML)</title>

<script type="module">

// Core AppKit
import { createAppKit } from "https://cdn.jsdelivr.net/npm/@reown/appkit@1.8.15/dist/appkit.min.js";

// Wagmi Adapter
import { WagmiAdapter } from "https://cdn.jsdelivr.net/npm/@reown/appkit-adapter-wagmi@1.8.15/dist/wagmi-adapter.min.js";

// Networks (WORKING!)
import {
    mainnet,
    arbitrum,
    bsc
} from "https://cdn.jsdelivr.net/npm/@reown/appkit@1.8.15/dist/networks/networks.min.js";

// UI Components (NEEDED FOR <appkit-button>)
import "https://cdn.jsdelivr.net/npm/@reown/appkit@1.8.15/dist/ui/appkit-ui.min.js";


// ---------------- CONFIG ----------------
const projectId = "0215bcf8c9091ca434a370c845ebd9b4";

const networks = [mainnet, arbitrum, bsc];

const wagmiAdapter = new WagmiAdapter({
    projectId,
    networks
});

// Initialize AppKit Modal
createAppKit({
    adapters: [wagmiAdapter],
    projectId,
    networks
});

</script>

<style>
    body {
        font-family: Arial;
        padding: 40px;
    }
</style>

</head>
<body>

<h1>Login with Trust Wallet</h1>

<!-- WORKING BUTTON -->
<appkit-button></appkit-button>

</body>
</html>
