<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet Login (AppKit v1.6.0)</title>

    <script type="module">

        // --- Core Imports (Requested Version 1.6.0) ---
        // NOTE: The 'bundle' query parameter is added here, matching the structure you provided.
        import { createAppKit } from 'https://esm.sh/@reown/appkit@1.6.0?bundle'; 
        import { WagmiAdapter } from 'https://esm.sh/@reown/appkit-adapter-wagmi@1.6.0?bundle'; 
        
        // --- Network Definitions (Hardcoded to prevent 404 on the '/networks?bundle' path) ---
        const mainnet = { id: 1, name: 'Ethereum', nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 }, rpcUrls: { default: { http: ['https://mainnet.infura.io/v3/'] } } };
        const arbitrum = { id: 42161, name: 'Arbitrum One', nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 }, rpcUrls: { default: { http: ['https://arb1.arbitrum.io/rpc'] } } };
        const bsc = { id: 56, name: 'BNB Smart Chain', nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 }, rpcUrls: { default: { http: ['https://bsc-dataseed.bnbchain.org'] } } };


        // --- Configuration (Matching your requested structure) ---

        const projectId = "87a3bb99cce9e1250fe4d16e89c5b192"; 
        
        // Equivalent to: export const networks = [mainnet, arbitrum, bsc]; 
        const networks = [mainnet, arbitrum, bsc]; 
        
        // 1. Create Wagmi Adapter
        const wagmiAdapter = new WagmiAdapter({
            'projectId': projectId,
            'networks': networks
        });
        
        // 2. Define Metadata (Using explicit values instead of obfuscated function calls)
        const metadata = {
            'name': 'AppKit v1.6.0 Demo', // Equivalent to 'name': 'AppKit Example'
            'description': 'Web3 Wallet Connection Demo (v1.6.0).', // Equivalent to a0_0x3498fc(0x8f)
            'url': window.location.origin, // Equivalent to a0_0x3498fc(0x8d)
            'icons': ["https://example.com/dapp-logo.png"] // Equivalent to [a0_0x3498fc(0x8a)]
        };
        
        // 3. Initialize AppKit Modal
        const modal = createAppKit({
            'adapters': [wagmiAdapter],
            'networks': networks,
            'metadata': metadata,
            'projectId': projectId,
            'features': {
                'analytics': true // Equivalent to 'analytics': !! []
            }
        });
        
        // 4. Expose modal instance (Equivalent to window[a0_0x3498fc(0x87)] = modal;)
        window.web3ModalInstance = modal; 


        // --- Status and Display Logic (Functional requirement) ---
        
        const updateStatus = (account, chainId) => {
            const statusElement = document.getElementById('status-container');
            if (account) {
                const chainName = networks.find(n => n.id === chainId)?.name || `Chain ID ${chainId}`;
                statusElement.innerHTML = `
                    <p style="color: green;">Status: **Connected**</p>
                    <p>Address: <b>${account.address.substring(0, 6)}...${account.address.slice(-4)}</b></p>
                    <p>Network: ${chainName}</p>
                `;
            } else {
                statusElement.innerHTML = '<p style="color: red;">Status: **Disconnected**</p>';
            }
        };

        // 5. Event Listeners
        wagmiAdapter.on('connect', ({ account, chainId }) => {
            updateStatus(account, chainId);
        });

        wagmiAdapter.on('disconnect', () => {
            updateStatus(null, null);
        });

        // 6. Dynamic button rendering and initial check
        document.addEventListener('DOMContentLoaded', () => {
            // Wait 1 second to ensure the custom element is registered by the SDK
            setTimeout(() => {
                const container = document.getElementById('button-container');
                container.innerHTML = ''; // Clear loading message
                const button = document.createElement('appkit-button');
                container.appendChild(button);
                
                // Initial connection check
                const initialAccount = wagmiAdapter.getAccount();
                if (initialAccount) {
                    updateStatus(initialAccount, initialAccount.chainId);
                } else {
                    updateStatus(null, null);
                }
            }, 1000); 
        });

    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }
        #status-container {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: inline-block;
            text-align: left;
        }
        #status-container p {
            margin: 5px 0;
        }
    </style>
</head>

<body>
    <h1>Trust Wallet Login Demo (AppKit v1.6.0)</h1>
    
    <div id="button-container">
        <p>Loading Wallet SDK...</p>
    </div>

    <div id="status-container">
        <p style="color: red;">Status: **Disconnected**</p>
    </div>

</body>
</html>
