<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet Login (v1.6.0 Clean)</title>

<script type="module">

// ---------------------- IMPORTS ----------------------
import { createAppKit } from "https://esm.sh/@reown/appkit@1.6.0?bundle";
import { WagmiAdapter } from "https://esm.sh/@reown/appkit-adapter-wagmi@1.6.0?bundle";
import { mainnet, arbitrum, bsc } from "https://esm.sh/@reown/appkit@1.6.0/networks?bundle";


// ---------------------- PROJECT ID ----------------------
const projectId = "0215bcf8c9091ca434a370c845ebd9b4";   // Your real working ID


// ---------------------- SUPPORTED NETWORKS ----------------------
const networks = [mainnet, arbitrum, bsc];


// ---------------------- WAGMI ADAPTER ----------------------
const wagmiAdapter = new WagmiAdapter({
    projectId,
    networks
});


// ---------------------- METADATA ----------------------
const metadata = {
    name: "AppKit Example",
    description: "Simple HTML Trust Wallet Login",
    url: "https://example.com",
    icons: ["https://avatars.githubusercontent.com/u/37784886"]
};


// ---------------------- INITIALIZE APPKIT ----------------------
const modal = createAppKit({
    projectId,
    adapters: [wagmiAdapter],
    networks,
    metadata,
    features: {
        analytics: true
    }
});


// Make modal available globally (optional)
window.appkit = modal;

</script>

<style>
    body {
        font-family: Arial;
        padding: 40px;
    }
</style>

</head>

<body>

    <h1>Login with Trust Wallet</h1>

    <!-- Button automatically rendered by AppKit -->
    <appkit-button></appkit-button>

</body>
</html>
